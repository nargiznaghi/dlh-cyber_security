title: Execution of Unseen Reconnaissance Tools
id: 8d2e4f6a-9b1c-4d3e-8f5a-7b6c5d4e3f2a
status: experimental
description: Detects execution of reconnaissance tools not observed in the 3x01 baseline report.
references:
  - https://attack.mitre.org/tactics/TA0007/
author: Blue Team
date: 2026/09/14
logsource:
  category: process_creation
detection:
  selection_windows:
    product: windows
    Image|endswith:
      - '\whoami.exe'
      - '\net.exe'
      - '\systeminfo.exe'
      - '\tasklist.exe'
      - '\netstat.exe'
      - '\nmap.exe'
  selection_linux:
    product: linux
    Image|endswith:
      - '/whoami'
      - '/net'
      - '/systeminfo'
      - '/tasklist'
      - '/netstat'
      - '/nmap'
  selection_baseline:
    baseline_seen: false
  condition: (selection_windows or selection_linux) and selection_baseline
falsepositives:
  - Authorized system administrator performing manually verified reconnaissance
level: medium
tags:
  - attack.discovery
  - attack.t1087
  - attack.t1082
