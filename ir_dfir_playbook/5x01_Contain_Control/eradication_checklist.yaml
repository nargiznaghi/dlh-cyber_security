items:
- id: ERAD-001
  category: malware_artifact
  target_host: WST-WS-031
  description: Remove dropped malware files and persistence mechanisms
  command_or_action: Remove-Item -Path "C:\Windows\Temp\payload.exe", "C:\Users\dmarsh\AppData\Roaming\msbuild_helper.exe" -Force
  verification_command: Test-Path on both paths and endpoint live-response file listing
  expected_verification_result: both paths return false and live-response returns no match
  status: executed
  executed_at: "2026-04-14T10:15:00Z"
  executed_by: Nargiz Naghiyeva

- id: ERAD-002
  category: malware_artifact
  target_host: WST-WS-031
  description: Remove scheduled task persistence (random GUID name)
  command_or_action: schtasks /delete /tn "UpdateTask_7721" /f
  verification_command: schtasks /query | findstr "UpdateTask_7721"
  expected_verification_result: no matches
  status: executed
  executed_at: "2026-04-14T10:20:00Z"
  executed_by: Nargiz Naghiyeva

- id: ERAD-003
  category: malware_artifact
  target_host: WST-WS-017
  description: Remove scheduled task persistence and msbuild artifacts on WST-WS-017
  command_or_action: schtasks /delete /tn "UpdateTask_9942" /f; Remove-Item "C:\Windows\Temp\msbuild.exe" -Force
  verification_command: schtasks /query | findstr "UpdateTask_9942"
  expected_verification_result: no matches
  status: executed
  executed_at: "2026-04-14T10:30:00Z"
  executed_by: Nargiz Naghiyeva

- id: ERAD-004
  category: malware_artifact
  target_host: LIS-WSIDE-01
  description: Inspect and clear temporary staging folders used during lateral movement
  command_or_action: Remove-Item -Path "C:\Windows\Temp\*.tmp" -Force
  verification_command: Get-ChildItem "C:\Windows\Temp\*.tmp"
  expected_verification_result: zero matching files
  status: executed
  executed_at: "2026-04-14T10:45:00Z"
  executed_by: Nargiz Naghiyeva

- id: ERAD-005
  category: process
  target_host: WST-WS-017
  description: Terminate malicious msbuild processes communicating with C2
  command_or_action: Stop-Process -Name "msbuild" -Force
  verification_command: Get-Process -Name "msbuild" -ErrorAction SilentlyContinue
  expected_verification_result: process not found / error running
  status: executed
  executed_at: "2026-04-14T10:28:00Z"
  executed_by: Nargiz Naghiyeva

- id: ERAD-006
  category: credential
  target_host: domain
  description: Reset dmarsh AD password and revoke Azure AD sessions and refresh tokens
  command_or_action: Set-ADAccountPassword + Revoke-AzureADUserAllRefreshToken
  verification_command: check Azure AD sign-in logs for reuse of prior tokens
  expected_verification_result: no successful sign-ins using prior tokens after reset
  status: executed
  executed_at: "2026-04-14T11:00:00Z"
  executed_by: Nargiz Naghiyeva

