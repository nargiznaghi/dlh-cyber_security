- id: ERAD-010
  category: krbtgt
  target_host: domain
  description: Double-reset of krbtgt following confirmed Pass-the-Ticket
  command_or_action: Reset-ADAccountPassword -Identity krbtgt (twice, with full AD replication between resets)
  rationale: Pass-the-Ticket was observed on dmarsh; krbtgt material must be invalidated domain-wide to kill all outstanding forged tickets
  verification_command: audit TGT issuance timestamps and invalidate sessions older than reset
  expected_verification_result: no valid TGTs issued before the reset timestamp
  status: executed
  executed_at: "2026-04-14T11:45:00Z"
  executed_by: Nargiz Naghiyeva

- id: ERAD-011
  category: network
  target_host: internal
  description: Enforce internal network micro-segmentation blocking workstation-to-workstation SMB/CIFS traffic
  command_or_action: New-NetFirewallRule -DisplayName "Block-Workstation-SMB" -Direction Inbound -Protocol TCP -LocalPort 445 -Action Block
  verification_command: Test-NetConnection -ComputerName LIS-WSIDE-01 -Port 445
  expected_verification_result: TcpTestSucceeded : False
  status: executed
  executed_at: "2026-04-14T12:00:00Z"
  executed_by: Nargiz Naghiyeva

