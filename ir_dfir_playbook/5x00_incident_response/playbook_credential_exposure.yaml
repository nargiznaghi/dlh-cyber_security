# Author: Nargiz Naghiyeva
# Date: 2026-10-14

playbook_id: PB-CRED-01
title: Credential Exposure and Compromise Response
owner_role: IR_Commander

applies_to:
  triggers:
    - DET-M365-PHISH-LOGIN-01
    - Wazuh EDR Credential Stuffing Alert
  indicators:
    - Suspicious foreign IP login following external credential harvesting
    - Impossible travel login anomaly in Azure AD sign-in logs

severity_mapping:
  initial: SEV2
  escalate_if:
    - ePHI or patient records accessed during exposure window
    - Attacker establishes persistence via mailbox rules or app registrations

immediate_actions:
  - step: Export Azure AD sign-in and audit logs for the compromised account
    owner: Scribe
    timebox_minutes: 15
  - step: Terminate all active sessions and tokens for the user in Azure AD
    owner: Technical_Lead
    timebox_minutes: 15
  - step: Initiate Active Directory password reset and force cloud synchronization
    owner: Technical_Lead
    timebox_minutes: 15

evidence_preservation:
  - artifact: Authentication logs and Azure AD sign-in history
    method: Export via Microsoft Entra admin center or Graph API audit log pull
    before_step: Terminate active sessions and revoke tokens
  - artifact: Affected mailbox logs and item access audit export
    method: Exchange Online PowerShell Search-MailboxAuditLog and export to CSV
    before_step: Disable mailbox or reset client application credentials
  - artifact: Recent data access audit export across Epic and file shares
    method: Splunk SIEM export of user session access logs
    before_step: Revoke VPN tokens and reset session states

containment_actions:
  - step: Reset Active Directory and Azure AD user account password
    owner: Technical_Lead
    decision_point: Immediate lockout vs. brief observation to capture attacker IP
    trade_off: Immediate reset stops active compromise but sacrifices attacker session visibility and telemetry
  - step: Revoke Azure AD sessions and refresh tokens
    owner: Technical_Lead
    decision_point: None
    trade_off: Terminates all active connections including legitimate user workflows, ensuring zero active attacker persistence
  - step: Reset MFA device bindings and re-register Azure MFA
    owner: Technical_Lead
    decision_point: None
    trade_off: Requires user re-enrollment and temporary downtime for legitimate multi-factor authentication
  - step: Revoke VPN access tokens and terminate active VPN sessions
    owner: Technical_Lead
    decision_point: None
    trade_off: Severs remote clinical access until re-authenticated securely
  - step: Terminate active Epic EHR client sessions
    owner: Technical_Lead
    decision_point: None
    trade_off: Interrupts active clinical documentation workflows for patient safety and record integrity

eradication_actions:
  - Remove unauthorized inbox forwarding rules and malicious mail flow rules created by the attacker
  - Delete unauthorized OAuth applications or API service principals registered during the exposure window
  - Purge persistent persistence mechanisms from local workstation cache and browser sessions

recovery_validation:
  - check: Verify successful Azure AD sign-in with new credentials and valid MFA challenge
    criterion: User authenticates successfully with zero anomalous IP or impossible travel alerts
  - check: Confirm absence of unauthorized background API requests or session tokens in Entra ID
    criterion: Zero active sessions outside of verified current timestamp and workstation IP

communication_plan:
  - audience: Legal_Liaison
    trigger: Confirmation of ePHI access or exfiltration during the compromise window
    template: notification_legal_hipaa.md
  - audience: Executive_Sponsor
    trigger: Escalation to SEV1 due to widespread clinical system exposure or regulatory risk
    template: notification_executive_summary.md
  - audience: Communications_Lead
    trigger: Internal department notification regarding credential hygiene and reset procedures
    template: notification_internal_advisory.md

escalation_triggers:
  - Confirmed ePHI access or data download during the attacker exposure window requiring HIPAA assessment
  - Failure to contain access within the 30-minute SEV2 time threshold without progress
  - Lateral movement from the compromised user account to critical clinical servers or LIS/Epic databases

post_incident_tasks:
  - Conduct root cause analysis on the initial phishing vector and landing page
  - Review Azure AD conditional access policies and strengthen MFA enforcement rules
  - Hand over complete timeline and artifact export package to post-incident review board
